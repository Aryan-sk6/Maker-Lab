<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maker Lab dev host</title>
    <link rel="stylesheet" href="../common/base.css" />
    <style>
      body { padding: 12px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      select, textarea { font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
      textarea { width: 100%; height: 180px; padding: 8px; }
      iframe { width: 100%; height: 600px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
      pre { white-space: pre-wrap; font-size: 12px; background: var(--panel); padding: 8px; border-radius: 6px; max-height: 200px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Maker Lab dev host</h1>
    <p class="muted">
      A minimal MCP Apps host for local testing: calls a tool on this server, renders its widget in a sandboxed iframe with
      the widget's declared CSP, and passes data over the MCP Apps bridge. Not a substitute for testing in ChatGPT and Claude.
    </p>
    <div class="row">
      <label>Tool <select id="tool"></select></label>
      <label>Theme <select id="theme"><option>light</option><option>dark</option></select></label>
      <button id="run" class="primary" type="button">Call tool</button>
    </div>
    <textarea id="args" spellcheck="false" aria-label="Tool arguments (JSON)"></textarea>
    <p class="status" id="status"></p>
    <iframe id="frame" title="Widget" sandbox="allow-scripts"></iframe>
    <h2 class="muted" style="font-size: 13px">Text content returned to the model</h2>
    <pre id="text"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
