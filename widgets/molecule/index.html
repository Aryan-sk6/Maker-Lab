<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maker Lab molecule viewer</title>
    <link rel="stylesheet" href="../common/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar" role="toolbar" aria-label="Display options">
        <div class="group" role="group" aria-label="Style">
          <span class="label">Style</span>
          <button type="button" data-style="stick" aria-pressed="false">Stick</button>
          <button type="button" data-style="sphere" aria-pressed="false">Sphere</button>
          <button type="button" data-style="cartoon" aria-pressed="false">Cartoon</button>
        </div>
        <div class="group" role="group" aria-label="Colour">
          <span class="label">Colour</span>
          <button type="button" data-color="element" aria-pressed="false">Element</button>
          <button type="button" data-color="chain" aria-pressed="false">Chain</button>
        </div>
        <div class="group">
          <button type="button" id="spin" aria-pressed="false">Spin</button>
          <button type="button" id="reset">Reset view</button>
          <button type="button" id="fullscreen" hidden>Fullscreen</button>
        </div>
      </div>

      <div class="main">
        <div id="viewer-wrap">
          <div id="viewer" role="img" aria-label="3D molecule. Drag to rotate, scroll to zoom."></div>
          <div id="overlay" class="overlay">Waiting for the molecule…</div>
        </div>

        <aside>
          <h1 id="name">Molecule</h1>
          <dl id="facts"></dl>
          <p class="source">
            Source: <a id="source-link" href="#" rel="noopener noreferrer"></a>
          </p>
          <p class="muted small" id="data-note"></p>
          <p class="muted small" id="legend"></p>
        </aside>
      </div>

      <p class="notice" id="disclaimer"></p>
      <p class="status" id="status" role="status"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
